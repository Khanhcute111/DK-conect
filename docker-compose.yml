services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dkconnect
      POSTGRES_USER: dkconnect
      POSTGRES_PASSWORD: dkconnect_local_password
    ports:
      - "5432:5432"
    volumes:
      - dkconnect_pg:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dkconnect -d dkconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgres://dkconnect:dkconnect_local_password@db:5432/dkconnect
      PORT: 3000
      UPLOAD_DIR: /var/data/dkconnect/uploads
    ports:
      - "3000:3000"
    volumes:
      - dkconnect_media:/var/data/dkconnect
    depends_on:
      db:
        condition: service_healthy
volumes:
  dkconnect_media:
  dkconnect_pg:
